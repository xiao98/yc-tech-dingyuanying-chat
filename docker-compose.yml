# YC TECH 丁元英 Chat — P3a production docker-compose.
# ==================================================================
# Replaces the upstream LibreChat single-stack compose. Differences:
#   1. system-lock-proxy sidecar sits between LibreChat and YCAPI so
#      the messages[0].system override (P2b) cannot be bypassed.
#   2. nginx + certbot terminate TLS for the DOMAIN env.
#   3. Only nginx exposes 80/443 to the host. mongo / redis / api /
#      sidecar all stay on the internal `ycchat-net` network.
#   4. Payment webhook handlers (P3b) will mount under /api/payment/*
#      on the same api service — no extra container needed.
#
# Required env vars (`deploy.sh` checks all of these):
#   YCAPI_BASE_URL  YCAPI_ADMIN_KEY
#   NEWAPI_ADMIN_BASE_URL  NEWAPI_ADMIN_KEY
#   ALIPAY_APP_ID  ALIPAY_PRIVATE_KEY_PATH  ALIPAY_PUBLIC_KEY_PATH
#   STRIPE_SECRET_KEY  STRIPE_WEBHOOK_SECRET
#   MONGO_URI  JWT_SECRET  DOMAIN
#   SUBKEY_ENCRYPTION_KEY  SKILL_MD_PATH  UPSTREAM_BASE_URL

services:
  mongo:
    image: mongo:7
    container_name: ycchat-mongo
    restart: always
    command: mongod --noauth
    volumes:
      - mongo-data:/data/db
    networks:
      - ycchat-net

  redis:
    image: redis:7-alpine
    container_name: ycchat-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - ycchat-net

  librechat-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ycchat-api
    restart: always
    depends_on:
      - mongo
      - redis
      - system-lock-proxy
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - YCAPI_BASE_URL=http://system-lock-proxy:8080
      - YCAPI_ADMIN_KEY=${YCAPI_ADMIN_KEY}
      - NEWAPI_ADMIN_BASE_URL=${NEWAPI_ADMIN_BASE_URL}
      - NEWAPI_ADMIN_KEY=${NEWAPI_ADMIN_KEY}
      - SUBKEY_ENCRYPTION_KEY=${SUBKEY_ENCRYPTION_KEY}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
      - ALIPAY_PRIVATE_KEY_PATH=${ALIPAY_PRIVATE_KEY_PATH}
      - ALIPAY_PUBLIC_KEY_PATH=${ALIPAY_PUBLIC_KEY_PATH}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./images:/app/client/public/images
      - ./secrets:/run/secrets:ro
    networks:
      - ycchat-net

  system-lock-proxy:
    build:
      context: ./services/system-lock-proxy
      dockerfile: Dockerfile
    container_name: ycchat-sidecar
    restart: always
    environment:
      - LISTEN_PORT=8080
      - UPSTREAM_BASE_URL=${YCAPI_BASE_URL}
      - SKILL_MD_PATH=/etc/system-lock-proxy/skill.md
    volumes:
      - ./services/system-lock-proxy/test/fixtures/skill.md:/etc/system-lock-proxy/skill.md:ro
    networks:
      - ycchat-net

  nginx:
    image: nginx:alpine
    container_name: ycchat-nginx
    restart: always
    depends_on:
      - librechat-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "envsubst '$$DOMAIN'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    networks:
      - ycchat-net

  certbot:
    image: certbot/certbot
    container_name: ycchat-certbot
    volumes:
      - ./nginx/certbot-www:/var/www/certbot
      - ./nginx/letsencrypt:/etc/letsencrypt
    # Triggered explicitly by deploy.sh via `docker compose run --rm certbot ...`
    # Default entrypoint is `certbot`; deploy.sh passes the full subcommand.
    profiles:
      - certbot

networks:
  ycchat-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
